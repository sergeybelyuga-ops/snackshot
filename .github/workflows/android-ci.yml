# docs/Architecture/12_dev-and-test-environment.md §7.1
name: android-ci

on:
  push:
    branches: [main]
    paths: ['android/**', 'test-fixtures/**', '.github/workflows/android-ci.yml']
  pull_request:
    paths: ['android/**', 'test-fixtures/**', '.github/workflows/android-ci.yml']

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: ktlint, lint, unit tests, dev build
        run: ./gradlew ktlintCheck lintLocalDebug unitTests assembleDevDebug --continue

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          retention-days: 7
