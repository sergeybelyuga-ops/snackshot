# docs/Architecture/12_dev-and-test-environment.md §7.1, §8
# dev:  signed devRelease APK → Firebase App Distribution (group "owner").
# prod: signed prodRelease AAB as a workflow artifact → upload to the Play internal track by hand.
# Both jobs run only from main (GitHub environment branch policies); prod waits for approval.
name: distribute-android

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment
        type: choice
        options: [dev, prod]
        default: dev
      notes:
        description: Release notes
        type: string
        default: ''

permissions:
  contents: read

jobs:
  dev:
    if: inputs.env == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.p12"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/signing.p12" >> "$GITHUB_ENV"

      - name: Build devRelease
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleDevRelease -PversionCode=${{ github.run_number }}

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # The CLI prints a 1-hour APK download link; this repo is public, so filter it out of the log.
      - name: Upload to App Distribution
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          set -o pipefail
          npx --yes firebase-tools@15.37.0 appdistribution:distribute \
            app/build/outputs/apk/dev/release/app-dev-release.apk \
            --app "${{ vars.FIREBASE_ANDROID_APP_ID }}" \
            --groups owner \
            --release-notes "${NOTES:-dev build} (${GITHUB_SHA::7}, run ${{ github.run_number }})" \
            2>&1 | grep -v -e 'app-binary-downloads' -e 'Download the release binary'

  prod:
    if: inputs.env == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore upload key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::UPLOAD_KEYSTORE_BASE64 is not set in the prod environment (created in WBS 11.4)."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"

      - name: Build prodRelease AAB
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleProdRelease -PversionCode=${{ github.run_number }}

      - uses: actions/upload-artifact@v7
        with:
          name: snackshot-prod-${{ github.run_number }}
          path: android/app/build/outputs/bundle/prodRelease/app-prod-release.aab
          retention-days: 30
